# =============================================================================
# Security Gate — 머지 전 보안 점검 자동화 (GitHub Actions)
#
# 설치: 이 파일을 서비스 저장소의 .github/workflows/security-gate.yml 로 복사
# 강제: 복사 후 GitHub 저장소 Settings → Branches → main 브랜치 보호 규칙에서
#       "Require status checks to pass before merging" 활성화 →
#       아래 'Security Gate Passed' 체크를 필수(required)로 지정해야
#       점검 실패 시 실제로 머지가 막힌다. (워크플로만으로는 강제되지 않음)
#
# 스킬: pre-merge-security-review 의 6개 게이트 중 자동화 가능한 항목을 구현.
#   Gate 1 인젝션      → sast-injection (Semgrep)
#   Gate 3 의존성 CVE  → dependency-scan (npm audit + Trivy)
#   Gate 4 시크릿 유출 → secret-scan (Gitleaks)
#   Gate 5 AI 생성 코드 → sast-injection 이 함께 검사 (+ npm ci 실패 = 환각 패키지 신호)
#   Gate 2 접근 제어   → 자동화 불가. 사람 리뷰 필수 (아래 PR 승인 규칙 참고)
#   Gate 6 프롬프트 인젝션 → 자동화 불가. LLM 기능 PR은 사람 리뷰 필수
# =============================================================================

name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # --- Gate 1 & 5: 인젝션 + AI 생성 코드 정적 분석 ---------------------------
  sast-injection:
    name: "Gate 1/5 — SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep (SQL injection, XSS, command injection 등)
        # --error: 취약점 발견 시 exit code 1 → 잡(job) 실패 → 머지 차단
        # --config=auto 는 --metrics=off 와 함께 쓸 수 없어 항상 실패했다. 고정 규칙셋을 쓴다.
        run: semgrep scan --config p/default --error --metrics=off

  # --- Gate 4: 시크릿(키/비밀번호) 유출 -------------------------------------
  secret-scan:
    name: "Gate 4 — Secret Leak (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 커밋 히스토리 검사
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 참고: 개인/공개 저장소는 무료. GitHub Organization 저장소는
        # 별도 GITLEAKS_LICENSE secret 이 필요할 수 있음.

  # --- Gate 3: 의존성 CVE (Node.js + 전체 파일시스템) -----------------------
  dependency-scan:
    name: "Gate 3 — Dependency CVE (npm audit + Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        # npm ci 가 실패하면 lockfile 불일치 또는 존재하지 않는(환각) 패키지 신호 — 숨기지 않는다
        run: npm ci
      - name: npm audit (high·critical 발견 시 차단)
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # 패치 없는 CVE 는 제외(노이즈 감소)
          exit-code: "1"         # 발견 시 잡 실패 → 머지 차단

  # --- Gate 4: 타입 검사 + DB 권한 회귀 테스트 ---------------------------------
  # 별·결제 상태를 이용자 권한으로 바꿀 수 없는지 임시 Postgres 에서 확인한다
  # (2026-10 출시 점검에서 누구나 별을 무제한 지급할 수 있던 구멍).
  typecheck-and-db:
    name: "Gate 4 — Typecheck + DB permissions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: DB permission test (lock-paid-state)
        run: |
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          bash supabase/tests/lock-paid-state.sh

  # --- (선택) DAST: 실행 중인 스테이징에 실제 공격 시뮬레이션 ---------------
  # 저장소 Settings → Secrets and variables → Actions → Variables 에
  # STAGING_URL 변수를 등록하면 자동 활성화됨. 없으면 이 잡은 건너뜀.
  dast-zap:
    name: "Gate (선택) — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}

  # --- 종합 게이트: 위 잡이 모두 통과해야 성공 ------------------------------
  # 브랜치 보호 규칙에서 이 'Security Gate Passed' 체크 하나만
  # required 로 지정하면 전체 게이트가 강제된다.
  security-gate-passed:
    name: "Security Gate Passed"
    runs-on: ubuntu-latest
    needs: [sast-injection, secret-scan, dependency-scan, typecheck-and-db]
    if: ${{ always() }}
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ needs.sast-injection.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.typecheck-and-db.result }}" != "success" ]; then
            echo "::error::보안 게이트 실패 — 머지 차단. 위 잡의 로그를 확인하세요."
            exit 1
          fi
          echo "자동 게이트 통과. 단, Gate 2(접근제어/IDOR)와 Gate 6(프롬프트 인젝션)은"
          echo "자동화 불가 — 반드시 사람이 PR 리뷰에서 직접 확인할 것."
